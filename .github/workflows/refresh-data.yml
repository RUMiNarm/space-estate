name: Refresh data from primary sources
on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run data:fetch
      - run: pnpm run data:normalize
      - run: pnpm test
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: data-refresh
          title: 'Refresh data from primary sources'
          body: 'Automated monthly snapshot of NASA / JPL / Exoplanet Archive data. Review data/normalized/report.json for count changes and re-check curated text if values moved.'
          commit-message: 'Refresh data from primary sources'
